# Builds one Android app, signs it with its upload key, and sends it to a Google Play track.
# Run by hand only: Actions > Android Play upload > Run workflow. Owner guide: android/PLAY-CI.md
#
# Secrets (Settings > Secrets and variables > Actions):
#   PLAY_SERVICE_ACCOUNT_JSON                       the service account's JSON key (owner creates it)
#   DEWCLAW_KEYSTORE_B64, DEWCLAW_KEYSTORE_PASSWORD, DEWCLAW_KEY_ALIAS, DEWCLAW_KEY_PASSWORD
#   KCOPENTRAIL_KEYSTORE_B64, KCOPENTRAIL_KEYSTORE_PASSWORD, KCOPENTRAIL_KEY_ALIAS, KCOPENTRAIL_KEY_PASSWORD
name: Android Play upload

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [dewclaw, kc-open-trail]
        required: true
      track:
        description: 'Play track: internal (testers, minutes), alpha (closed testing), beta (open testing), production (everyone; needs the extra permission)'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
        required: true
      release_notes:
        description: "What's new (optional, English, up to 500 characters)"
        type: string
        required: false
      status:
        description: 'Release status: auto = draft while the app has never been rolled out, otherwise completed'
        type: choice
        options: [auto, draft, completed]
        default: auto
      version_code:
        description: 'Version code (optional; normally left empty = highest code Play has + 1)'
        type: string
        required: false
      version_name:
        description: 'Version name people see (optional; empty = appVersionName in twa-manifest.json)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-play-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  upload:
    name: ${{ inputs.app }} to ${{ inputs.track }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Settings > Environments > play: add required reviewers there if you want a second
    # pair of eyes before every upload (optional). Repository secrets work as well.
    environment: play
    env:
      APP: ${{ inputs.app }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: App settings
        id: cfg
        env:
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const app = process.env.APP;
          const cfg = require('./android/play-apps.json')[app];
          if (!cfg) throw new Error('unknown app ' + app);
          const twa = require('./' + cfg.dir + '/twa-manifest.json');
          if (twa.packageId !== cfg.packageId) throw new Error('package in play-apps.json does not match twa-manifest.json');
          const name = (process.env.VERSION_NAME_INPUT || '').trim() || twa.appVersionName;
          if (!/^[0-9A-Za-z._ -]{1,50}$/.test(name)) throw new Error('version name may use letters, digits, . _ - and spaces only');
          const notes = process.env.NOTES || '';
          if ([...notes].length > 500) throw new Error('release notes are longer than 500 characters');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            'dir=' + cfg.dir, 'package=' + cfg.packageId, 'prefix=' + cfg.secretPrefix,
            'sha256=' + cfg.uploadKeySha256, 'version_name=' + name, ''].join('\n'));
          console.log(`${app}: ${cfg.packageId}, version name ${name}, upload key ${cfg.uploadKeySha256}`);
          EOF

      - name: Ask Play for the next version code
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE_OVERRIDE: ${{ inputs.version_code }}
          STATUS_INPUT: ${{ inputs.status }}
          PACKAGE: ${{ steps.cfg.outputs.package }}
        run: node tools/play/play-state.mjs "$PACKAGE"

      - name: JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 36, build-tools 35.0.0)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for p in "platforms;android-36" "build-tools;35.0.0"; do
            if [ -d "$ANDROID_HOME/${p//;//}" ]; then echo "have $p"; else yes | "$SDKM" "$p" > /dev/null; echo "installed $p"; fi
          done

      - name: Bubblewrap (npm ci)
        working-directory: android
        run: npm ci --no-audit --no-fund

      - name: Upload key from secrets
        env:
          KEYSTORE_B64: ${{ secrets[format('{0}_KEYSTORE_B64', steps.cfg.outputs.prefix)] }}
          KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', steps.cfg.outputs.prefix)] }}
          KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', steps.cfg.outputs.prefix)] }}
        run: bash tools/play/keystore.sh decode "$RUNNER_TEMP/upload.keystore"

      - name: Build, sign, and check package, version, target SDK 36, billing and the upload key
        env:
          KC_KEYSTORE_PASS: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', steps.cfg.outputs.prefix)] }}
          KC_KEY_PASS: ${{ secrets[format('{0}_KEY_PASSWORD', steps.cfg.outputs.prefix)] }}
          KC_KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', steps.cfg.outputs.prefix)] }}
          KC_VERSION_CODE: ${{ steps.play.outputs.version_code }}
          KC_VERSION_NAME: ${{ steps.cfg.outputs.version_name }}
          KC_EXPECT_SHA256: ${{ steps.cfg.outputs.sha256 }}
          DIR: ${{ steps.cfg.outputs.dir }}
        run: |
          ./"$DIR"/build.sh "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/out"
          AAB="$(ls "$RUNNER_TEMP"/out/*.aab)"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP"/out/*-test.apk

      - name: Remove the upload key
        if: always()
        run: bash tools/play/keystore.sh remove "$RUNNER_TEMP/upload.keystore"

      - name: Release notes
        id: notes
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -n "$NOTES" ]; then
            mkdir -p "$RUNNER_TEMP/whatsnew"
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
            echo "dir=$RUNNER_TEMP/whatsnew" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the bundle as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app }}-${{ steps.cfg.outputs.version_name }}-${{ steps.play.outputs.version_code }}
          path: ${{ env.AAB }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Google Play (${{ inputs.track }})
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.cfg.outputs.package }}
          releaseFiles: ${{ env.AAB }}
          tracks: ${{ inputs.track }}
          status: ${{ steps.play.outputs.status }}
          releaseName: ${{ steps.cfg.outputs.version_name }} (${{ steps.play.outputs.version_code }})
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}
          changesNotSentForReview: false

      - name: Summary
        if: success()
        env:
          TRACK: ${{ inputs.track }}
          STATUS: ${{ steps.play.outputs.status }}
          CODE: ${{ steps.play.outputs.version_code }}
          NAME: ${{ steps.cfg.outputs.version_name }}
        run: |
          {
            echo "### $APP $NAME (code $CODE) sent to the $TRACK track, status $STATUS"
            if [ "$STATUS" = draft ]; then
              echo "It is a **draft**: open Play Console > Test and release > $TRACK, and press Review release > Roll out."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
