name = "kcbeyond-studio"
main = "studio-worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Shares Dewclaw's KV namespace; every studio key starts with "studio:".
[[kv_namespaces]]
binding = "KV"
id = "6a2ea4a5764442cabc3139a389c464f4"

# Workers AI: the listing writer's free model when no Anthropic key is set
[ai]
binding = "AI"

[vars]
# The studio website's address, once it is on Netlify. Payments stay off until this is set.
APP_ORIGIN = ""
# Set to the same address to accept requests from the studio site only.
ALLOWED_ORIGIN = "*"
# Stripe price IDs for one-time prices. Payments stay off until these are filled in.
STUDIO_PRICES = "{\"rainfort_plus\":\"\",\"listing_pack\":\"\"}"
STRIPE_TAX = "auto"
# Secrets (set in the Cloudflare dashboard, never in this file):
#   STRIPE_SECRET_KEY, and optionally ANTHROPIC_API_KEY
