<!doctype html>
<!-- Feature graphic for Google Play, 1024 x 500. The picture is a real, unedited frame of the game (HUD hidden),
     taken at Cathedral Park with the St. Johns Bridge behind KC. Only the title and the dark fade are added.
     Rebuild: node make-feature.js (see README.md in this folder's parent). -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  #fg { position: relative; width: 1024px; height: 500px; overflow: hidden; background: #12261e; font-family: "Inter Display", Inter, "Segoe UI", Arial, sans-serif; }
  #fg img { position: absolute; left: -50px; top: -42px; height: 550px; width: 1496px; }
  #fg .fade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,30,22,.86) 0%, rgba(10,30,22,.72) 30%, rgba(10,30,22,.25) 52%, rgba(10,30,22,0) 64%); }
  #fg .t { position: absolute; left: 64px; top: 128px; width: 470px; color: #fff; }
  #fg h1 { margin: 0; font-weight: 900; font-size: 84px; line-height: .98; letter-spacing: -2px; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #fg h1 span { color: #ffb02e; }
  #fg p { margin: 22px 0 0; font-weight: 600; font-size: 28px; line-height: 1.25; color: #e9f3ec; }
</style>
<div id="fg">
  <img src="feature-backdrop-2720x1000.png" alt="">
  <div class="fade"></div>
  <div class="t"><h1><span>KC:</span><br>Open Trail</h1><p>A free-roam dog adventure</p></div>
</div>
